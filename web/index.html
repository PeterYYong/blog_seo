<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Naver Blog SEO · WebMCP Demo</title>
  <style>
    :root{font-family:Inter,system-ui,sans-serif;color:#eaf6f0;background:#07130e}body{margin:0}.wrap{max-width:960px;margin:auto;padding:48px 22px}header{padding:32px;border:1px solid #214a37;border-radius:22px;background:linear-gradient(135deg,#10291d,#0a1812)}h1{font-size:clamp(2rem,6vw,4rem);margin:.2em 0}.tag{color:#62e69b;text-transform:uppercase;letter-spacing:.16em}main{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}.card{padding:24px;background:#0d2017;border:1px solid #214a37;border-radius:18px}label{display:block;margin:12px 0 6px}input,button{box-sizing:border-box;width:100%;padding:13px;border-radius:10px;border:1px solid #32644b;background:#08150f;color:#fff}button{margin-top:16px;background:#35c878;color:#03130a;font-weight:800;cursor:pointer}pre{white-space:pre-wrap;word-break:break-word;color:#b9ddc9;min-height:90px}.badge{display:inline-block;padding:6px 10px;border-radius:20px;background:#173d2a;color:#74eca7}@media(max-width:700px){main{grid-template-columns:1fr}}
  </style>
</head><body><div class="wrap"><header><div class="tag">The WebMCP Challenge</div><h1>검색 데이터를<br>실행 가능한 근거로.</h1><p>Naver Blog SEO 분석을 브라우저 에이전트가 직접 호출할 수 있는 8개 WebMCP 도구로 제공합니다.</p><span id="support" class="badge">WebMCP 확인 중…</span></header>
<main><section class="card"><h2>라이브 데모</h2><label for="keyword">키워드</label><input id="keyword" value="서울 캠핑"><label for="volume">월 검색량</label><input id="volume" type="number" value="2400"><label for="docs">문서 수</label><input id="docs" type="number" value="1200"><button id="run">SEO 지표 계산</button></section><section class="card"><h2>구조화된 결과</h2><pre id="output">버튼을 누르면 같은 계산 로직의 결과가 표시됩니다.</pre></section></main></div>
<script type="module">
const now=()=>new Date().toISOString();
const metric=({keyword,monthly_search_volume,total_documents})=>{const sk=monthly_search_volume<50?0:total_documents/monthly_search_volume;const ek=monthly_search_volume<50?0:(.05/(sk+1))*Math.log10(Math.max(monthly_search_volume,1));return {ok:true,tool:'calculate_seo_metrics',retrieved_at:now(),data:{keyword,monthly_search_volume,total_documents,saturation_index:+sk.toFixed(6),efficiency_score:+ek.toFixed(6),classification:monthly_search_volume<50?'insufficient-volume':sk<1?'blue-ocean':sk<5?'competitive':'red-ocean',recommended:monthly_search_volume>=50&&sk<1},evidence:{formula:'Sk=documents/volume; Ek=(0.05/(Sk+1))*log10(volume)',live_data:false},sources:[{name:'Project scoring methodology',url:'METHODOLOGY.md'}]}};
const schemas={keyword:{type:'string',minLength:1,maxLength:100},monthly_search_volume:{type:'integer',minimum:0},total_documents:{type:'integer',minimum:0}};
const tools=[
 {name:'expand_keywords',description:'Expand a seed keyword into long-tail candidates.',inputSchema:{type:'object',properties:{keyword:schemas.keyword},required:['keyword']},execute:({keyword})=>({ok:true,tool:'expand_keywords',retrieved_at:now(),data:{seed:keyword,keywords:[keyword,`${keyword} 추천`,`${keyword} 후기`,`${keyword} 방법`]},evidence:{method:'deterministic demo expansion',live_data:false},sources:[]})},
 {name:'calculate_seo_metrics',description:'Calculate Naver SEO saturation and efficiency.',inputSchema:{type:'object',properties:schemas,required:Object.keys(schemas)},execute:metric},
 {name:'analyze_keyword',description:'Classify one keyword from supplied measurements.',inputSchema:{type:'object',properties:schemas,required:Object.keys(schemas)},execute:metric},
 {name:'analyze_keyword_batch',description:'Explain batch analysis availability.',inputSchema:{type:'object',properties:{items:{type:'array',minItems:1,maxItems:50,items:{type:'object'}}},required:['items']},execute:({items})=>({ok:true,tool:'analyze_keyword_batch',retrieved_at:now(),data:{results:items.map(metric).map(x=>x.data).sort((a,b)=>b.efficiency_score-a.efficiency_score)},evidence:{live_data:false},sources:[]})},
 {name:'get_related_keywords',description:'Report safe Naver Ads integration state.',inputSchema:{type:'object',properties:{keyword:schemas.keyword},required:['keyword']},execute:()=>({ok:false,tool:'get_related_keywords',retrieved_at:now(),error:{code:'SERVER_REQUIRED',message:'Call the authenticated MCP deployment.',retryable:false},data:null,evidence:{},sources:[]})},
 {name:'get_trending_keywords',description:'Report optional trend integration state.',inputSchema:{type:'object',properties:{limit:{type:'integer',minimum:1,maximum:20}}},execute:()=>({ok:false,tool:'get_trending_keywords',retrieved_at:now(),error:{code:'LIVE_LOOKUP_DISABLED',message:'Trend scraping is disabled.',retryable:false},data:null,evidence:{},sources:[]})},
 {name:'get_configuration_status',description:'Show integration readiness without secrets.',inputSchema:{type:'object',properties:{}},execute:()=>({ok:true,tool:'get_configuration_status',retrieved_at:now(),data:{browser_demo:true,live_integrations:false},evidence:{secret_values_exposed:false},sources:[]})},
 {name:'health_check',description:'Check WebMCP demo readiness.',inputSchema:{type:'object',properties:{}},execute:()=>({ok:true,tool:'health_check',retrieved_at:now(),data:{status:'ready',protocols:['WebMCP']},evidence:{live_data:false},sources:[]})}
];
if(navigator.modelContext?.registerTool){tools.forEach(tool=>navigator.modelContext.registerTool(tool));document.querySelector('#support').textContent='WebMCP · 8 tools registered'}else{document.querySelector('#support').textContent='WebMCP unavailable · interactive fallback active'}
document.querySelector('#run').onclick=()=>{const result=metric({keyword:document.querySelector('#keyword').value.trim(),monthly_search_volume:+document.querySelector('#volume').value,total_documents:+document.querySelector('#docs').value});document.querySelector('#output').textContent=JSON.stringify(result,null,2)};
</script></body></html>
